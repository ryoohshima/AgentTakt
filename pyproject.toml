[project]
name = "agenttakt"
version = "0.1.0"
description = "Review, edit, and approve AI agent task plans in a visual node editor in your terminal (MCP server + TUI)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ryo Ohshima", email = "ryo.ohshima.official@gmail.com" }]
keywords = ["mcp", "tui", "textual", "agent", "plan", "approval", "node-editor"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Terminals",
]
dependencies = [
    "textual>=8.2",
    "mcp>=1.9,<2",
    "pydantic>=2.7",
]

[project.urls]
Homepage = "https://github.com/ryoohshima/AgentTakt"
Repository = "https://github.com/ryoohshima/AgentTakt"
Issues = "https://github.com/ryoohshima/AgentTakt/issues"

[project.scripts]
agenttakt = "agenttakt.cli:main"
at = "agenttakt.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-textual-snapshot",
    "textual-dev",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agenttakt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
