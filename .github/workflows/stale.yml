name: Stale Issues / PRs

# 古い Issue / PR に stale ラベルを付けて可視化する（自動クローズはしない）。
# 初期ユーザーの質問 issue が bot にクローズされると定着施策（#37）に反するため、
# クローズ判断は人間が行う。

on:
  schedule:
    - cron: "0 0 * * 1"  # 毎週月曜 00:00 UTC (= JST 月曜 09:00)
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-stale: 30
          days-before-close: -1
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: "pinned,security,keep-open"
          exempt-pr-labels: "pinned,security,keep-open"
          stale-issue-message: >-
            この Issue は 30 日間活動がないため stale としてマークされました。
            まだ有効な場合はコメントで教えてください。
          stale-pr-message: >-
            この PR は 30 日間活動がないため stale としてマークされました。
            まだ有効な場合はコメントで教えてください。
